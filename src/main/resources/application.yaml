server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://buyio-auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://buyio-catalog-service:8082}
          predicates:
            - Path=/api/v1/catalog/**
          filters:
            - RewritePath=/api/v1/catalog/(?<segment>.*), /api/v1/$\{segment}

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://buyio-order-service:8083}
          predicates:
            - Path=/api/v1/orders/**

        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://buyio-audit-service:8084}
          predicates:
            - Path=/api/v1/audit-logs/**